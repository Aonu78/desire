{% load static %}

<!-- JavaScript files-->
      <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
      <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
      <script src="{% static 'vendor/lightbox2/js/lightbox.min.js' %}"></script>
      <script src="{% static 'vendor/nouislider/nouislider.min.js' %}"></script>
      <script src="{% static 'vendor/bootstrap-select/js/bootstrap-select.min.js' %}"></script>
      <script src="{% static 'vendor/owl.carousel2/owl.carousel.min.js' %}"></script>
      <script src="{% static 'vendor/owl.carousel2.thumbs/owl.carousel2.thumbs.min.js' %}"></script>
      <script src="{% static 'js/front.js' %}"></script>

      <script>
        // Debounced AJAX search + category filter for shop page
        (function(){
          var timer;
          function debounce(fn, delay){
            return function(){
              var ctx = this, args = arguments;
              clearTimeout(timer);
              timer = setTimeout(function(){ fn.apply(ctx, args); }, delay);
            };
          }

          function ajaxFetch(url){
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
            xhr.onload = function(){
              if(xhr.status >= 200 && xhr.status < 400){
                var container = document.getElementById('product-grid');
                if(container){ container.innerHTML = xhr.responseText; }
              }
            };
            xhr.send();
          }

          function buildUrl(){
            var base = '{% url "store:shop" %}';
            var q = document.querySelector('input[name="q"]')?.value || '';
            var category = document.querySelector('select[name="category"]')?.value || '';
            var params = [];
            if(q) params.push('q=' + encodeURIComponent(q));
            if(category) params.push('category=' + encodeURIComponent(category));
            return base + (params.length ? ('?' + params.join('&')) : '');
          }

          var input = document.querySelector('input[name="q"]');
          var select = document.querySelector('select[name="category"]');
          if(input){
            input.addEventListener('input', debounce(function(){
              var url = buildUrl();
              ajaxFetch(url);
            }, 300));
          }
          if(select){
            select.addEventListener('change', function(){
              var url = buildUrl();
              ajaxFetch(url);
            });
          }

          // Delegate clicks on pagination links to AJAX
          document.addEventListener('click', function(e){
            var target = e.target.closest('.page-link');
            if(!target) return;
            var href = target.getAttribute('href');
            if(!href) return;
            // only intercept links that are query links (page=)
            if(href.indexOf('page=') !== -1){
              e.preventDefault();
              var base = '{% url "store:shop" %}';
              var prefix = base.indexOf('?') === -1 ? base : base.split('?')[0];
              var currentQuery = buildUrl();
              // if href is relative like ?page=2... use it directly
              var url = href.startsWith('?') ? (prefix + href) : href;
              ajaxFetch(url);
            }
          });
        })();
      </script>

      <script>
        var range = document.getElementById('range');
        if (range) {
          noUiSlider.create(range, {
              range: {
                  'min': 0,
                  'max': 2000
              },
              step: 5,
              start: [100, 1000],
              margin: 300,
              connect: true,
              direction: 'ltr',
              orientation: 'horizontal',
              behaviour: 'tap-drag',
              tooltips: true,
              format: {
                to: function ( value ) {
                  return '$' + value;
                },
                from: function ( value ) {
                  return value.replace('', '');
                }
              }
          });
        }
      </script>

      
      <script>
        // ------------------------------------------------------- //
        //   Inject SVG Sprite - 
        //   see more here 
        //   https://css-tricks.com/ajaxing-svg-sprite/
        // ------------------------------------------------------ //
        function injectSvgSprite(path) {
        
            var ajax = new XMLHttpRequest();
            ajax.open("GET", path, true);
            ajax.send();
            ajax.onload = function(e) {
            var div = document.createElement("div");
            div.className = 'd-none';
            div.innerHTML = ajax.responseText;
            document.body.insertBefore(div, document.body.childNodes[0]);
            }
        }
        // this is set to BootstrapTemple website as you cannot 
        // inject local SVG sprite (using only 'icons/orion-svg-sprite.svg' path)
        // while using file:// protocol
        // pls don't forget to change to your domain :)
        injectSvgSprite('{% static "icons/orion-svg-sprite.svg" %}'); 
        
      </script>
      <!-- FontAwesome CSS - loading as last, so it doesn't block rendering-->
      <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.1/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
    </div>
  </body>
</html>
