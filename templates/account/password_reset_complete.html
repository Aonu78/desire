{% extends 'base.html' %}
{% load static %}

    {% block content %}

      <div class="container py-5">
        <div class="col-md-8 offset-2">

        {% comment %} <h1 class="mb-5">Password Changed</h1> {% endcomment %}
        
        
        <div class="card mb-4" id="forms">
          
          <div class="card-body">
           
            <h1>New Password Set Successfully.</h1>
            
            <div class="text-center">
              Let's <a href="{% url 'store:login' %}"> Login.</a>
            </div>
            
          </div>
        </div>

        </div>       
      </div>
      <style>
/* Orange Theme Buttons for Password Reset Page */

/* Primary Orange Button (if you have any) */
.btn-primary {
    background-color: #FF6B35 !important;
    border-color: #FF6B35 !important;
    color: white !important;
    border-radius: 25px;
    padding: 10px 25px;
    font-weight: 500;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(255, 107, 53, 0.2);
}

.btn-primary:hover {
    background-color: #E54B1A !important;
    border-color: #E54B1A !important;
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(255, 107, 53, 0.3);
}

/* Link styling (for the Login link) */
a {
    color: #FF6B35 !important;
    text-decoration: none;
    font-weight: 600;
    transition: all 0.3s ease;
    position: relative;
    padding: 5px 10px;
}

a:hover {
    color: #E54B1A !important;
    text-decoration: underline;
}

/* Optional: Add a subtle orange background to the card */
.card {
    border: none;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(255, 107, 53, 0.1);
    text-align: center;
}

.card h1 {
    color: #333;
    margin-bottom: 20px;
    position: relative;
    padding-bottom: 15px;
}

.card h1:after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 3px;
    background: #FF6B35;
    border-radius: 2px;
}

/* Success icon styling (if you want to add one) */
.card h1 i {
    color: #FF6B35;
    margin-right: 10px;
}

/* Text center div styling */
.text-center {
    margin-top: 20px;
}

.text-center a {
    background-color: #FF6B35;
    color: white !important;
    padding: 10px 30px;
    border-radius: 25px;
    display: inline-block;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(255, 107, 53, 0.2);
}

.text-center a:hover {
    background-color: #E54B1A;
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(255, 107, 53, 0.3);
    text-decoration: none;
    color: white !important;
}
      </style>
{% endblock content %}
